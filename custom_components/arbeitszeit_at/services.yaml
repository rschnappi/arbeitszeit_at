refresh:
auszahlung_erfassen:
  fields:
    datum:
      required: true
      example: "2026-05-15"
      selector:
        date:
    stunden:
      required: true
      example: 20
      selector:
        number:
          min: 0
          max: 1000
          step: 0.25
          unit_of_measurement: h
          mode: box
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: arbeitszeit_at
auszahlung_entfernen:
  fields:
    datum:
      required: true
      example: "2026-05-15"
      selector:
        date:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: arbeitszeit_at
